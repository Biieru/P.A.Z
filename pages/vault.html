<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050810" />
  <title>Vault · P.A.Z</title>
  <link rel="icon" type="image/png" href="/assets/images/logo-paz.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <style>
    /* =========================================================
       Vault — Arquivo de Notícias
       ========================================================= */

    .vault-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: clamp(40px, 7vw, 90px) var(--gutter) 100px;
    }

    /* ---- Masthead ---- */
    .vault-masthead {
      text-align: center;
      margin-bottom: clamp(48px, 7vw, 80px);
      padding-bottom: clamp(28px, 4vw, 44px);
      border-bottom: 1px solid rgba(201, 169, 97, 0.35);
      position: relative;
    }

    .vault-masthead__corner {
      position: absolute;
      width: 18px; height: 18px;
      border: 1px solid var(--gold-deep);
      pointer-events: none;
    }
    .vault-masthead__corner--tl { top: 0; left: 0; border-right: none; border-bottom: none; }
    .vault-masthead__corner--tr { top: 0; right: 0; border-left: none; border-bottom: none; }

    .vault-masthead__eyebrow {
      font-family: var(--font-head);
      font-size: 10.5px;
      letter-spacing: 0.55em;
      color: var(--bone-dim);
      text-transform: uppercase;
      margin: 0 0 10px;
    }

    .vault-masthead__title {
      font-family: var(--font-display);
      font-size: clamp(36px, 6vw, 68px);
      font-weight: 700;
      letter-spacing: 0.12em;
      margin: 0 0 12px;
      background: linear-gradient(180deg, #f4ebd0 0%, #d5c79e 35%, #8e7a4a 80%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .vault-masthead__desc {
      font-family: var(--font-body);
      font-style: italic;
      font-size: clamp(15px, 1.4vw, 17px);
      color: var(--text-dim);
      margin: 0;
      max-width: 560px;
      margin: 0 auto;
    }

    /* ---- Grid de cards ---- */
    .vault-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(18px, 2.5vw, 28px);
    }

    /* Estado vazio */
    .vault-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 24px;
      font-family: var(--font-body);
      font-style: italic;
      color: var(--bone-dim);
      font-size: 18px;
      border: 1px solid rgba(201, 169, 97, 0.15);
      position: relative;
    }
    .vault-empty::before, .vault-empty::after {
      content: "";
      position: absolute;
      width: 16px; height: 16px;
      border: 1px solid rgba(201, 169, 97, 0.3);
      pointer-events: none;
    }
    .vault-empty::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .vault-empty::after  { bottom: -1px; right: -1px; border-left: none; border-top: none; }

    /* ---- Card individual ---- */
    .vault-card {
      position: relative;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(30, 69, 102, 0.2) 0%, transparent 70%),
        linear-gradient(180deg, rgba(10, 20, 36, 0.92) 0%, rgba(5, 8, 16, 0.98) 100%);
      border: 1px solid rgba(201, 169, 97, 0.28);
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
                  border-color 0.35s ease,
                  box-shadow 0.35s ease;
    }

    .vault-card::before, .vault-card::after {
      content: "";
      position: absolute;
      width: 14px; height: 14px;
      border: 1.5px solid var(--gold);
      pointer-events: none;
      z-index: 2;
      transition: width 0.3s ease, height 0.3s ease;
    }
    .vault-card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .vault-card::after  { bottom: -1px; right: -1px; border-left: none; border-top: none; }

    .vault-card:hover {
      transform: translateY(-5px);
      border-color: var(--gold-bright);
      box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.9),
                  inset 0 0 32px rgba(74, 192, 255, 0.05);
    }
    .vault-card:hover::before, .vault-card:hover::after {
      width: 20px; height: 20px;
      border-color: var(--gold-bright);
    }

    /* Thumbnail do card */
    .vault-card__thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: rgba(5, 8, 16, 0.9);
      position: relative;
      flex-shrink: 0;
    }

    .vault-card__thumb img,
    .vault-card__thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease, filter 0.5s ease;
      filter: brightness(0.75) saturate(0.9);
    }

    .vault-card:hover .vault-card__thumb img,
    .vault-card:hover .vault-card__thumb video {
      transform: scale(1.04);
      filter: brightness(0.9) saturate(1.05);
    }

    /* Overlay de "Ler mais" sobre a thumb */
    .vault-card__thumb-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      background: rgba(5, 8, 16, 0.55);
      transition: opacity 0.3s ease;
    }

    .vault-card:hover .vault-card__thumb-overlay { opacity: 1; }

    .vault-card__thumb-label {
      font-family: var(--font-head);
      font-size: 11px;
      letter-spacing: 0.36em;
      color: var(--bone);
      text-transform: uppercase;
      border: 1px solid rgba(201, 169, 97, 0.5);
      padding: 7px 18px;
      background: rgba(5, 8, 16, 0.7);
    }

    /* Card sem mídia: placeholder decorativo */
    .vault-card__thumb--text {
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 60% 60% at 50% 50%, rgba(30, 69, 102, 0.35) 0%, transparent 100%);
      border-bottom: 1px solid rgba(201, 169, 97, 0.18);
    }

    .vault-card__thumb--text .vault-card__thumb-icon {
      font-family: var(--font-display);
      font-size: 36px;
      color: var(--gold-deep);
      opacity: 0.6;
      user-select: none;
    }

    /* Corpo do card */
    .vault-card__body {
      padding: 18px 18px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .vault-card__meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .vault-card__category {
      font-family: var(--font-head);
      font-size: 9.5px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--ghost-cyan);
      background: rgba(74, 192, 255, 0.1);
      border: 1px solid rgba(74, 192, 255, 0.25);
      padding: 2px 8px;
      flex-shrink: 0;
    }

    .vault-card__date {
      font-family: var(--font-head);
      font-size: 10px;
      letter-spacing: 0.16em;
      color: var(--bone-dim);
      margin-left: auto;
      flex-shrink: 0;
    }

    .vault-card__title {
      font-family: var(--font-display);
      font-size: clamp(14px, 1.3vw, 18px);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--gold-bright);
      margin: 0 0 8px;
      line-height: 1.25;
    }

    .vault-card__subtitle {
      font-family: var(--font-body);
      font-size: clamp(13px, 1.1vw, 15px);
      font-style: italic;
      color: var(--text-dim);
      margin: 0 0 14px;
      line-height: 1.45;
      flex: 1;
    }

    .vault-card__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid rgba(201, 169, 97, 0.12);
      font-family: var(--font-head);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--bone-dim);
    }

    .vault-card__author { color: var(--gold); }

    /* =========================================================
       Modal de artigo completo
       ========================================================= */
    .vault-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(5, 8, 16, 0.92);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: clamp(16px, 4vw, 48px) clamp(16px, 4vw, 40px);
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .vault-modal-backdrop.is-open {
      opacity: 1;
      pointer-events: all;
    }

    .vault-modal {
      position: relative;
      width: 100%;
      max-width: 860px;
      background:
        radial-gradient(ellipse 80% 40% at 50% 0%, rgba(30, 69, 102, 0.2) 0%, transparent 70%),
        linear-gradient(180deg, rgba(8, 17, 30, 0.99) 0%, rgba(5, 8, 16, 1) 100%);
      border: 1px solid rgba(201, 169, 97, 0.38);
      padding: clamp(28px, 4vw, 52px);
      transform: translateY(20px) scale(0.98);
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .vault-modal-backdrop.is-open .vault-modal {
      transform: translateY(0) scale(1);
    }

    /* Cantos ornamentais do modal */
    .vault-modal::before, .vault-modal::after {
      content: "";
      position: absolute;
      width: 24px; height: 24px;
      border: 1.5px solid var(--gold);
      pointer-events: none;
    }
    .vault-modal::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .vault-modal::after  { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    /* Botão fechar */
    .vault-modal__close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 36px; height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bone-dim);
      border: 1px solid rgba(201, 169, 97, 0.2);
      background: rgba(5, 8, 16, 0.7);
      font-size: 18px;
      line-height: 1;
      transition: color 0.25s ease, border-color 0.25s ease;
      z-index: 2;
    }
    .vault-modal__close:hover { color: var(--gold-bright); border-color: var(--gold-bright); }

    /* Cabeçalho do modal */
    .vault-modal__header {
      margin-bottom: 22px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(201, 169, 97, 0.2);
    }

    .vault-modal__meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .vault-modal__category {
      font-family: var(--font-head);
      font-size: 10px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--ghost-cyan);
      background: rgba(74, 192, 255, 0.1);
      border: 1px solid rgba(74, 192, 255, 0.3);
      padding: 3px 10px;
    }

    .vault-modal__date {
      font-family: var(--font-head);
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--bone-dim);
    }

    .vault-modal__source {
      font-family: var(--font-head);
      font-size: 10.5px;
      letter-spacing: 0.16em;
      color: var(--bone-dim);
      margin-left: auto;
    }

    .vault-modal__title {
      font-family: var(--font-display);
      font-size: clamp(22px, 2.8vw, 34px);
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--gold-bright);
      margin: 0 0 10px;
      line-height: 1.2;
    }

    .vault-modal__subtitle {
      font-family: var(--font-body);
      font-style: italic;
      font-size: clamp(15px, 1.4vw, 18px);
      color: var(--bone-soft);
      margin: 0;
    }

    /* Mídia do modal */
    .vault-modal__media {
      margin: 24px 0;
    }

    .vault-modal__media img,
    .vault-modal__media video {
      max-width: 100%;
      display: block;
      border: 1px solid rgba(201, 169, 97, 0.25);
    }

    /* Para mídia portrait (9:16), centralizar e limitar largura */
    .vault-modal__media--portrait {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .vault-modal__media--portrait img,
    .vault-modal__media--portrait video {
      max-width: min(320px, 100%);
    }

    .vault-modal__media-caption {
      font-family: var(--font-body);
      font-size: 12.5px;
      font-style: italic;
      color: var(--bone-dim);
      text-align: center;
      margin-top: 8px;
    }

    /* Corpo do modal */
    .vault-modal__body {
      font-family: var(--font-body);
      font-size: clamp(15.5px, 1.4vw, 17.5px);
      color: var(--text);
      line-height: 1.75;
    }

    .vault-modal__body p { margin: 0 0 16px; }
    .vault-modal__body p:last-child { margin-bottom: 0; }
    .vault-modal__body strong { color: var(--bone); font-weight: 600; }

    /* Rodapé assinatura */
    .vault-modal__signature {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid rgba(201, 169, 97, 0.18);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .vault-modal__source-label {
      font-family: var(--font-head);
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--bone-dim);
    }

    .vault-modal__source-label span {
      color: var(--bone);
    }

    .vault-modal__author {
      font-family: var(--font-body);
      font-style: italic;
      font-size: 15px;
      color: var(--gold);
    }


    /* ---- YouTube embed ---- */
    .yt-embed {
      position: relative;
      aspect-ratio: 16 / 9;
      width: 100%;
      overflow: hidden;
      background: #000;
    }
    .yt-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .yt-embed--short {
      aspect-ratio: 9 / 16;
      max-width: 280px;
      margin: 0 auto;
    }

    /* ---- Multi-youtube grid ---- */
    .multi-yt-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .multi-yt-label {
      font-family: var(--font-head);
      font-size: 10.5px;
      letter-spacing: 0.28em;
      color: var(--gold);
      text-transform: uppercase;
      margin: 0 0 8px;
    }

    /* ---- Twitter links ---- */
    .twitter-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .twitter-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 11px 22px;
      border: 1px solid rgba(201, 169, 97, 0.35);
      color: var(--bone);
      font-family: var(--font-head);
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: rgba(5, 8, 16, 0.6);
      text-decoration: none;
      transition: border-color 0.25s ease, color 0.25s ease;
      width: fit-content;
    }
    .twitter-link:hover { border-color: var(--gold-bright); color: var(--gold-bright); }

    /* ---- Nota sem mídia ---- */
    .vault-modal__media-note {
      font-family: var(--font-body);
      font-style: italic;
      font-size: 13.5px;
      color: var(--bone-dim);
      border-left: 2px solid rgba(201, 169, 97, 0.3);
      padding-left: 14px;
      margin: 0;
    }

    @media (max-width: 640px) {
      .multi-yt-grid { grid-template-columns: 1fr; }
      .yt-embed--short { max-width: 100%; }
    }
    /* ---- Responsivo ---- */
    @media (max-width: 1000px) {
      .vault-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      .vault-grid { grid-template-columns: 1fr; }
      .vault-modal { padding: 24px 18px 28px; }
      .vault-modal__meta { gap: 8px; }
      .vault-modal__source { margin-left: 0; }
    }
  </style>
</head>
<body data-page="vault">

  <div class="page-transition" id="pageTransition" aria-hidden="true"></div>

  <div class="atmosphere" aria-hidden="true">
    <div class="atmosphere__vignette"></div>
    <div class="atmosphere__grain"></div>
    <div class="atmosphere__bg"></div>
  </div>

  <header class="site-header">
    <div class="site-header__inner">
      <a href="/" class="brand" data-link>
        <img src="/assets/images/logo-paz.png" alt="" class="brand__logo" />
        <span class="brand__name">P.A.Z</span>
      </a>
      <nav class="nav" aria-label="Navegação principal">
        <ul class="nav__list">
          <li><a href="/"                      class="nav__link" data-link>Início</a></li>
          <li><a href="/pages/esquadroes.html" class="nav__link" data-link>Esquadrões</a></li>
          <li><a href="/pages/cacadas.html"    class="nav__link" data-link>Caçadas</a></li>
          <li><a href="/pages/hierarquia.html" class="nav__link" data-link>Hierarquia</a></li>

        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="vault-page">

    <header class="vault-masthead">
      <span class="vault-masthead__corner vault-masthead__corner--tl"></span>
      <span class="vault-masthead__corner vault-masthead__corner--tr"></span>
      <p class="vault-masthead__eyebrow">P.A.Z — Arquivo Histórico</p>
      <h1 class="vault-masthead__title">Vault</h1>
      <p class="vault-masthead__desc">Registros e notícias anteriores preservados nos arquivos da tripulação.</p>
    </header>

    <!-- Grid populado por JS a partir de VAULT_ARTICLES -->
    <div class="vault-grid" id="vaultGrid">
      <!-- Cards renderizados pelo script abaixo -->
    </div>

  </main>

  <footer class="site-footer">
    <div class="site-footer__line"></div>
    <p>P.A.Z — Predators of the Abyssal Zone · Se quer ficar, lute.</p>
  </footer>

  <!-- Modal -->
  <div class="vault-modal-backdrop" id="vaultModal" role="dialog" aria-modal="true" aria-labelledby="vaultModalTitle">
    <div class="vault-modal" id="vaultModalBox">
      <button class="vault-modal__close" id="vaultModalClose" aria-label="Fechar">✕</button>
      <div class="vault-modal__header">
        <div class="vault-modal__meta">
          <span class="vault-modal__category" id="vaultModalCategory"></span>
          <span class="vault-modal__date"     id="vaultModalDate"></span>
          <span class="vault-modal__source"   id="vaultModalSourceTop"></span>
        </div>
        <h2 class="vault-modal__title"    id="vaultModalTitle"></h2>
        <p  class="vault-modal__subtitle" id="vaultModalSubtitle"></p>
      </div>
      <div class="vault-modal__media" id="vaultModalMedia"></div>
      <div class="vault-modal__body"  id="vaultModalBody"></div>
      <div class="vault-modal__signature">
        <span class="vault-modal__source-label">Fonte: <span id="vaultModalSource"></span></span>
        <span class="vault-modal__author" id="vaultModalAuthor"></span>
      </div>
    </div>
  </div>

  <script>
  /* ============================================================
     VAULT — Dados das notícias arquivadas
     ============================================================
     Para adicionar uma nova notícia, inclua um objeto no array
     VAULT_ARTICLES seguindo a estrutura abaixo.

     Campos:
       id        : número único (auto-incrementar)
       category  : string — ex: "Recrutamento", "Evento", "Arquivo"
       date      : string — data original da publicação, ex: "10 Jan 2025"
       title     : string — título completo
       subtitle  : string — linha de resumo / subtítulo
       media     : objeto com:
                     type    — "image" | "video" | "none"
                     src     — caminho do arquivo (ex: "/assets/images/foo.jpg")
                     alt     — texto alternativo
                     caption — legenda (opcional)
                     portrait— boolean, true para mídia 9:16 (ex: vídeos verticais)
       body      : array de strings, cada string é um parágrafo
       source    : string — origem da notícia, ex: "Discord da P.A.Z"
       author    : string — assinatura, ex: "Greed"
     ============================================================ */
  const VAULT_ARTICLES = [
  {
    id: 34,
    category: "Confirmação Oficial",
    date: "16 Abr 2026",
    title: "RELLGames Sinaliza que a Espera por RELL Seas Pode Estar Chegando ao Fim",
    subtitle: "RELLGames amplifica mensagem sugerindo que novidades de RELL Seas podem estar próximas.",
    media: {type:"twitter",url:"https://x.com/RELLGames/status/2044846638133284951",label:"Ver post — RELLGames no X",note:"O post republicado fazia referência a uma publicação original de 13 de abril de 2026."},
    body: [
      "A conta oficial da RELLGames republicou uma mensagem com a frase 'The wait won't be much longer', indicando que a espera por novidades de RELL Seas não deve durar muito mais.",
      "Esse item precisa ser tratado com cuidado. Ele é relevante como sinal recente de comunicação, mas não deve ser escrito como confirmação de lançamento, data oficial ou abertura pública do jogo.",
      "O valor jornalístico está no tom: depois de anos de desenvolvimento, teasers, movies, dev logs e vídeos de bastidores, a RELLGames voltou a amplificar uma mensagem sugerindo proximidade. Ainda assim, proximidade não é data.",

  /* ============================================================
     Renderização e lógica do Vault — não editar abaixo
     ============================================================ */
  (function () {
    const grid  = document.getElementById("vaultGrid");
    const modal = document.getElementById("vaultModal");

    /* ---- Renderizar grid de cards ---- */
    function renderGrid() {
      if (!VAULT_ARTICLES.length) {
        grid.innerHTML = `
          <div class="vault-empty">
            Nenhum registro arquivado ainda. Em breve os arquivos serão revelados.
          </div>`;
        return;
      }

      VAULT_ARTICLES.forEach(article => {
        const card = document.createElement("article");
        card.className = "vault-card";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.setAttribute("aria-label", "Abrir: " + article.title);

        card.innerHTML = `
          ${thumbHTML(article)}
          <div class="vault-card__body">
            <div class="vault-card__meta">
              <span class="vault-card__category">${article.category}</span>
              <span class="vault-card__date">${article.date}</span>
            </div>
            <h2 class="vault-card__title">${article.title}</h2>
            <p  class="vault-card__subtitle">${article.subtitle}</p>
            <div class="vault-card__footer">
              <span class="vault-card__author">— ${article.author}</span>
              <span>Fonte: ${article.source}</span>
            </div>
          </div>`;

        card.addEventListener("click",  () => openModal(article));
        card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openModal(article); }});
        grid.appendChild(card);
      });
    }

    function ytThumb(videoId) {
      return `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
    }

    function thumbHTML(a) {
      const m = a.media;
      // YouTube: usa thumbnail via ytimg
      if (m.type === "youtube" || m.type === "youtube-short") {
        return `<div class="vault-card__thumb">
          <img src="${ytThumb(m.videoId)}" alt="Thumbnail do vídeo" loading="lazy" />
          <div class="vault-card__thumb-overlay"><span class="vault-card__thumb-label">Assistir</span></div>
        </div>`;
      }
      // Multi-youtube: thumbnail do primeiro vídeo
      if (m.type === "multi-youtube") {
        return `<div class="vault-card__thumb">
          <img src="${ytThumb(m.videos[0].videoId)}" alt="Thumbnail da playlist" loading="lazy" />
          <div class="vault-card__thumb-overlay"><span class="vault-card__thumb-label">Ouvir</span></div>
        </div>`;
      }
      // Imagem
      if (m.type === "image") {
        return `<div class="vault-card__thumb">
          <img src="${m.src}" alt="${m.alt}" loading="lazy" />
          <div class="vault-card__thumb-overlay"><span class="vault-card__thumb-label">Ler</span></div>
        </div>`;
      }
      // Twitter / None: card de texto
      const icon = (m.type === "twitter" || m.type === "twitter-multi") ? "𝕏" : "P.A.Z";
      return `<div class="vault-card__thumb vault-card__thumb--text">
        <span class="vault-card__thumb-icon">${icon}</span>
        <div class="vault-card__thumb-overlay"><span class="vault-card__thumb-label">Ler</span></div>
      </div>`;
    }

    /* ---- Modal ---- */
    function openModal(a) {
      document.getElementById("vaultModalCategory").textContent  = a.category;
      document.getElementById("vaultModalDate").textContent      = a.date;
      document.getElementById("vaultModalSourceTop").textContent = "Fonte: " + a.source;
      document.getElementById("vaultModalTitle").textContent     = a.title;
      document.getElementById("vaultModalSubtitle").textContent  = a.subtitle;
      document.getElementById("vaultModalSource").textContent    = a.source;
      document.getElementById("vaultModalAuthor").textContent    = "— " + a.author;

      // Mídia
      const mediaEl = document.getElementById("vaultModalMedia");
      const m = a.media;
      mediaEl.className = "vault-modal__media";

      if (m.type === "none") {
        mediaEl.innerHTML = m.note
          ? `<p class="vault-modal__media-note">${m.note}</p>` : "";
        mediaEl.style.display = m.note ? "" : "none";

      } else if (m.type === "youtube") {
        mediaEl.style.display = "";
        mediaEl.innerHTML = `
          <div class="yt-embed">
            <iframe src="https://www.youtube.com/embed/${m.videoId}?rel=0"
              title="${a.title}" frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen></iframe>
          </div>
          ${m.caption ? `<p class="vault-modal__media-caption">${m.caption}</p>` : ""}`;

      } else if (m.type === "youtube-short") {
        mediaEl.style.display = "";
        mediaEl.className += " vault-modal__media--portrait";
        mediaEl.innerHTML = `
          <div class="yt-embed yt-embed--short">
            <iframe src="https://www.youtube.com/embed/${m.videoId}?rel=0"
              title="${a.title}" frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen></iframe>
          </div>
          ${m.caption ? `<p class="vault-modal__media-caption">${m.caption}</p>` : ""}`;

      } else if (m.type === "multi-youtube") {
        mediaEl.style.display = "";
        const grid = m.videos.map(v => `
          <div class="multi-yt-item">
            <p class="multi-yt-label">${v.label}</p>
            <div class="yt-embed">
              <iframe src="https://www.youtube.com/embed/${v.videoId}?rel=0"
                title="${v.label}" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
            </div>
          </div>`).join("");
        mediaEl.innerHTML = `
          <div class="multi-yt-grid">${grid}</div>
          ${m.caption ? `<p class="vault-modal__media-caption">${m.caption}</p>` : ""}`;

      } else if (m.type === "twitter") {
        mediaEl.style.display = "";
        const note = m.note ? `<p class="vault-modal__media-note">${m.note}</p>` : "";
        mediaEl.innerHTML = `
          <a href="${m.url}" target="_blank" rel="noopener noreferrer" class="twitter-link">
            <span>𝕏</span> ${m.label}
          </a>
          ${note}`;

      } else if (m.type === "twitter-multi") {
        mediaEl.style.display = "";
        const btns = m.links.map(l =>
          `<a href="${l.url}" target="_blank" rel="noopener noreferrer" class="twitter-link"><span>𝕏</span> ${l.label}</a>`
        ).join("");
        const note = m.note ? `<p class="vault-modal__media-note">${m.note}</p>` : "";
        mediaEl.innerHTML = `<div class="twitter-links">${btns}</div>${note}`;

      } else if (m.type === "image") {
        mediaEl.style.display = "";
        if (m.portrait) mediaEl.className += " vault-modal__media--portrait";
        mediaEl.innerHTML = `<img src="${m.src}" alt="${m.alt}" />
          ${m.caption ? `<p class="vault-modal__media-caption">${m.caption}</p>` : ""}`;
      }

      // Corpo
      document.getElementById("vaultModalBody").innerHTML =
        a.body.map(p => `<p>${p}</p>`).join("");

      modal.classList.add("is-open");
      document.body.style.overflow = "hidden";
      document.getElementById("vaultModalClose").focus();
    }

    function closeModal() {
      modal.classList.remove("is-open");
      document.body.style.overflow = "";
      modal.querySelectorAll("video").forEach(v => { v.pause(); v.currentTime = 0; });
      // Parar iframes do YouTube trocando o src
      modal.querySelectorAll("iframe").forEach(f => { const s = f.src; f.src = ""; f.src = s; });
    }

    document.getElementById("vaultModalClose").addEventListener("click", closeModal);
    modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && modal.classList.contains("is-open")) closeModal(); });

    renderGrid();
  })();
  </script>

  <script src="/js/main.js" defer></script>
</body>
</html>
